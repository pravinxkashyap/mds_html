<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milk Delivery Solutions — Book a Free Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1f17; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 40px 20px;
    }
    .card {
      background: #1a2e22; border-radius: 14px; padding: 44px 40px;
      max-width: 620px; width: 100%; box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
    .brand-icon { font-size: 28px; }
    .brand-name { font-size: 20px; font-weight: 700; color: #4ade80; }
    h1 { font-size: 26px; font-weight: 700; color: white; margin-bottom: 28px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #d1d5db; margin-bottom: 6px; }
    .req { color: #ef4444; }
    input, select, textarea {
      width: 100%; padding: 11px 14px;
      background: #243b2c; border: 1.5px solid #3d6349;
      border-radius: 8px; font-size: 14px; color: white;
      outline: none; transition: border-color 0.2s; font-family: inherit;
    }
    input::placeholder, textarea::placeholder { color: #6b7280; }
    select option { background: #243b2c; color: white; }
    input:focus, select:focus, textarea:focus { border-color: #4ade80; }
    .phone-row { display: grid; grid-template-columns: 170px 1fr; gap: 10px; }
    textarea { resize: vertical; min-height: 100px; }
    button {
      width: 100%; background: #166534; color: white; border: none;
      padding: 14px; border-radius: 9px; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: background 0.2s; margin-top: 4px;
    }
    button:hover { background: #14532d; }
    button:disabled { background: #1a3a25; cursor: not-allowed; }
    .status {
      margin-top: 16px; padding: 12px 16px; border-radius: 8px;
      font-size: 14px; text-align: center; display: none;
    }
    .status.success { background: #064e3b; color: #6ee7b7; border: 1px solid #065f46; }
    .status.error   { background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; }
  </style>
</head>
<body>
<div class="card">
  <div class="brand">
    <span class="brand-icon">🥛</span>
    <span class="brand-name">Milk Delivery Solutions</span>
  </div>
  <h1>Book a Free Demo</h1>

  <form id="form">
    <div class="row">
      <div class="field">
        <label>Name <span class="req">*</span></label>
        <input name="name" type="text" placeholder="Arjun Sharma" required>
      </div>
      <div class="field">
        <label>Email <span class="req">*</span></label>
        <input name="email" type="email" placeholder="arjun@milkfarm.in" required>
      </div>
    </div>
    <div class="field">
      <label>Mobile Number <span class="req">*</span></label>
      <div class="phone-row">
        <select name="phone_country">
          <option value="IN">India (भारत) +91</option>
          <option value="US">United States +1</option>
          <option value="CA">Canada +1</option>
          <option value="GB">United Kingdom +44</option>
          <option value="AU">Australia +61</option>
          <option value="AE">UAE +971</option>
        </select>
        <input name="phone_number" type="tel" placeholder="+91" required>
      </div>
    </div>
    <div class="field">
      <label>Business Name</label>
      <input name="business_name" type="text" placeholder="Sharma Dairy">
    </div>
    <div class="row">
      <div class="field">
        <label>Number of customers you serve?</label>
        <input name="number_of_customers_served" type="number" placeholder="300">
      </div>
      <div class="field">
        <label>Litres of milk delivered per day (Ltrs)</label>
        <input name="liters_of_milk_delivered_per_day" type="number" placeholder="1500">
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label>How many orders delivered per day?</label>
        <input name="how_many_orders_delivered_per_day" type="number" placeholder="280">
      </div>
      <div class="field">
        <label>How many delivery boys you have?</label>
        <input name="how_many_delivery_boys_you_have" type="number" placeholder="8">
      </div>
    </div>
    <div class="field">
      <label>Please provide details about your business</label>
      <textarea name="details_about_your_business" placeholder="We deliver milk subscriptions to 300 households across 3 routes..."></textarea>
    </div>
    <button type="submit" id="btn">Submit</button>
  </form>
  <div class="status" id="status"></div>
</div>
<script>
const SUBMIT_URL = 'https://lead-automation.staging02.com/submit';
document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const statusEl = document.getElementById('status');
  btn.disabled = true; btn.textContent = 'Sending…';
  const data = Object.fromEntries(new FormData(e.target).entries());
  data.source = 'mds';
  try {
    await fetch(SUBMIT_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    statusEl.className = 'status success';
    statusEl.textContent = '✅ Pipeline triggered — lead sent to automation.';
    statusEl.style.display = 'block';
    e.target.reset();
  } catch (err) {
    statusEl.className = 'status error';
    statusEl.textContent = '⚠️ Could not reach server: ' + err.message;
    statusEl.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = 'Submit';
});
</script>
</body>
</html>
