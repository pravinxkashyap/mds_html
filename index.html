<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Free Demo | Milk Delivery Solutions</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #eef4fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #16263b;
    }
    .wrap { width: 100%; max-width: 660px; }
    .brand { font-size: 22px; font-weight: 800; margin-bottom: 6px; color: #0e2a4d; }
    .brand b { color: #2f7fd1; }
    .lead { font-size: 14px; color: #4a5a6a; margin-bottom: 18px; }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(15,40,70,0.10);
      border-top: 4px solid #2f7fd1;
    }
    .card h3 { font-size: 21px; color: #0e2a4d; margin-bottom: 4px; }
    .card .sub { font-size: 13px; color: #6a7a8a; margin-bottom: 22px; }

    .field { margin-bottom: 15px; }
    .row { display: flex; gap: 14px; }
    .row .field { flex: 1; }
    label { display: block; font-size: 12px; font-weight: 600; color: #36465a; margin-bottom: 5px; }
    label .req { color: #e53935; }
    input, select, textarea {
      width: 100%; padding: 11px 13px; border: 1px solid #d3dce8; border-radius: 6px;
      font-size: 14px; font-family: inherit; background: #fff; color: #222;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: #2f7fd1; box-shadow: 0 0 0 3px rgba(47,127,209,0.13);
    }
    textarea { min-height: 80px; resize: vertical; }
    .phone-grp { display: flex; gap: 8px; }
    .phone-grp select { flex: 0 0 150px; }
    .phone-grp input { flex: 1; }

    button {
      margin-top: 8px; background: #2f7fd1; color: #fff; border: none;
      padding: 12px 30px; font-size: 15px; font-weight: 700; border-radius: 6px; cursor: pointer;
    }
    button:hover { background: #2569b0; }
    button:disabled { opacity: .6; cursor: not-allowed; }

    .status { margin-top: 14px; font-size: 13px; min-height: 18px; }
    .status.ok { color: #2e7d32; }
    .status.err { color: #d32f2f; }
    .status.pending { color: #6a7a8a; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">Milk <b>Delivery Solutions</b></div>
    <div class="lead">Dairy ERP &amp; subscription delivery software for milk and dairy home-delivery operators. Manage routes, subscriptions and returnable bottles.</div>

    <div class="card">
      <h3>Book a Free Demo</h3>
      <div class="sub">Share a few details about your milk delivery business and we'll set up a demo.</div>

      <form id="leadForm">
        <div class="field">
          <label>Name <span class="req">*</span></label>
          <input type="text" name="name" required>
        </div>

        <div class="field">
          <label>Email <span class="req">*</span></label>
          <input type="email" name="email" required>
        </div>

        <div class="field">
          <label>Mobile Number <span class="req">*</span></label>
          <div class="phone-grp">
            <select id="country" name="country" required>
              <option value="India" data-code="+91" selected>India (+91)</option>
              <option value="United States" data-code="+1">United States (+1)</option>
              <option value="Canada" data-code="+1">Canada (+1)</option>
              <option value="United Kingdom" data-code="+44">United Kingdom (+44)</option>
              <option value="Australia" data-code="+61">Australia (+61)</option>
              <option value="United Arab Emirates" data-code="+971">UAE (+971)</option>
              <option value="Saudi Arabia" data-code="+966">Saudi Arabia (+966)</option>
              <option value="Kuwait" data-code="+965">Kuwait (+965)</option>
              <option value="Qatar" data-code="+974">Qatar (+974)</option>
              <option value="Kenya" data-code="+254">Kenya (+254)</option>
              <option value="Nigeria" data-code="+234">Nigeria (+234)</option>
              <option value="South Africa" data-code="+27">South Africa (+27)</option>
              <option value="Other" data-code="">Other</option>
            </select>
            <input type="tel" id="phone" name="mobile_number" placeholder="Mobile number" required>
          </div>
        </div>

        <div class="field">
          <label>Business Name</label>
          <input type="text" name="business_name">
        </div>

        <div class="row">
          <div class="field">
            <label>Number of customers you serve?</label>
            <input type="number" name="number_of_customers_served" min="0">
          </div>
          <div class="field">
            <label>Litres of milk delivered per day (Ltrs)</label>
            <input type="text" name="liters_of_milk_delivered_per_day">
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label>How many orders delivered per day?</label>
            <input type="number" name="orders_delivered_per_day" min="0">
          </div>
          <div class="field">
            <label>How many delivery boys you have?</label>
            <input type="text" name="delivery_boys">
          </div>
        </div>

        <div class="field">
          <label>Please provide details about your business</label>
          <textarea name="details_about_your_business"></textarea>
        </div>

        <input type="hidden" name="source" value="mds">

        <button type="submit" id="submitBtn">Submit</button>
        <div class="status" id="status"></div>
      </form>
    </div>
  </div>

  <script>
    const ENDPOINT = "https://lead-automation.staging02.com/submit";

    const form = document.getElementById('leadForm');
    const statusEl = document.getElementById('status');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Block submission until every required field is valid (shows native prompts)
      if (!form.reportValidity()) return;

      const data = Object.fromEntries(new FormData(form).entries());
      const countrySel = document.getElementById('country');
      const code = countrySel.selectedOptions[0].getAttribute('data-code') || '';
      if (data.mobile_number) data.mobile_number = (code ? code + ' ' : '') + data.mobile_number;
      data.submitted_at = new Date().toISOString();

      statusEl.textContent = 'Sending...';
      statusEl.className = 'status pending';
      btn.disabled = true;

      try {
        const res = await fetch(ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const out = await res.json().catch(() => ({ ok: res.ok }));
        if (res.ok && out.ok !== false) {
          statusEl.textContent = 'Thank you! Our team will reach out shortly.';
          statusEl.className = 'status ok';
          form.reset();
        } else {
          statusEl.textContent = 'Something went wrong: ' + (out.error || res.status);
          statusEl.className = 'status err';
        }
      } catch (err) {
        statusEl.textContent = 'Could not reach the server: ' + err.message;
        statusEl.className = 'status err';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
